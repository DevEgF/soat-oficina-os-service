name: CI

on:
  pull_request:
  push:
    # develop também, para o Sonar analisar a branch e os badges do README terem dados.
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Nome usado como check obrigatório na proteção da main.
    name: ci / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PR de fork não recebe secrets: a análise do Sonar é pulada quando o token está vazio.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo para o blame/novo código do Sonar.
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Testes e gate de cobertura (80% de linhas)
        run: ./gradlew --no-daemon check
      - name: Análise do Sonar com quality gate
        if: env.SONAR_TOKEN != ''
        run: ./gradlew --no-daemon sonar -Dsonar.qualitygate.wait=true
      - name: Resumo da cobertura
        if: always()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          if [ ! -f "$report" ]; then
            echo "Relatório JaCoCo não gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line = next(c for c in root.findall("counter") if c.get("type") == "LINE")
          missed, covered = int(line.get("missed")), int(line.get("covered"))
          total = missed + covered
          ratio = 100.0 * covered / total if total else 0.0
          print("### Cobertura de linhas")
          print()
          print(f"**{ratio:.2f}%** ({covered}/{total} linhas); mínimo exigido: 80%.")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: |
            build/reports
            build/test-results
          retention-days: 14
          if-no-files-found: warn

  image:
    # Nome usado como check obrigatório na proteção da main.
    name: ci / image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build da imagem (sem push)
        run: docker build -t "soat-oficina-os-service:${GITHUB_SHA}" .
