spring.application.name=os-service
server.port=${SERVER_PORT:8081}

# Required: no defaults outside the local/test profiles (see application-local.properties).
# Passwords follow the same rule: they come from the environment, never from this file.
app.environment=${APP_ENVIRONMENT}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Staff users of the login (admin, atendente, tecnico). Password equal to the user name is refused
# outside the local/test profiles (StaffCredentials).
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.attendant.password=${APP_SECURITY_ATTENDANT_PASSWORD}
app.security.technician.password=${APP_SECURITY_TECHNICIAN_PASSWORD}

# PostgreSQL of this service. Defaults match postgres-os in the platform docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/os}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:os}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# The database may still be starting when the pod starts (first deploy).
spring.flyway.connect-retries=20

# RabbitMQ of the platform (Service rabbitmq in the cluster, docker-compose locally).
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/

# Consumer of os.events: 3 attempts (1 + 2 retries) starting at 500 ms, then reject without requeue,
# which dead-letters to os.events.dlq. Poison messages skip the retry (ListenerRetryConfiguration).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# Actuator: only health, with Kubernetes probes. Readiness proves database and broker connectivity.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
