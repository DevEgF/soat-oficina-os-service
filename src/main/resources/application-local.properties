# Local development only (./gradlew bootRun activates this profile by default).
# Environment variables (APP_JWT_SECRET, APP_ENVIRONMENT, ...) still take precedence.
app.environment=hml
app.jwt.secret=local-oficina-jwt-secret-for-development-only

# Passwords of the platform docker-compose.yml (same values as its env file).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:oficina}

# Staff users for local development only (refused outside local/test by StaffCredentials).
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:admin}
app.security.attendant.password=${APP_SECURITY_ATTENDANT_PASSWORD:atendente}
app.security.technician.password=${APP_SECURITY_TECHNICIAN_PASSWORD:tecnico}
