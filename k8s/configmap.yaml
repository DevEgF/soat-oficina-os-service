# Configuração não sensível. Os segredos vêm do Secret os-service-secrets (ver secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  labels:
    app.kubernetes.io/name: os-service
data:
  SERVER_PORT: "8080"
  APP_ENVIRONMENT: "hml"
  # Validade do token emitido no login de staff.
  APP_JWT_EXPIRATION_MINUTES: "60"
  # Prazo para o cliente aprovar o orçamento (duração ISO-8601); vencido, a OS é cancelada.
  APP_SAGA_APPROVAL_TIMEOUT: "PT30M"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://os-postgres:5432/os"
  SPRING_DATASOURCE_USERNAME: "os"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "oficina"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"
  # Agente Java do New Relic: só liga se NEW_RELIC_LICENSE_KEY (Secret) não estiver vazio.
  NEW_RELIC_APP_NAME: "oficina-os-service"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  # Logs encaminhados levam o MDC (requestId e, no consumo de mensagens, sagaId, messageType e messageId).
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_CONTEXT_DATA_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  # request.uri fica de fora porque a rota interna de clientes leva o CPF/CNPJ no caminho; o nome da
  # transação continua com o padrão da rota (/api/internal/customers/{taxId}).
  NEW_RELIC_ATTRIBUTES_EXCLUDE: "request.uri,request.parameters.*,request.headers.*,response.headers.*,cpf,authorization,password"
  NEW_RELIC_TRANSACTION_TRACER_RECORD_SQL: "off"
  NEW_RELIC_LABELS: "environment:hml;service:os-service"
