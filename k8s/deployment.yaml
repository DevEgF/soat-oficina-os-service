apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: os-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-service
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: os-service
          # Sem registry: a imagem entra no nó por `kind load docker-image`.
          # O deploy troca esta tag pelo SHA do commit (overlay temporário); nunca usar latest.
          image: soat-oficina-os-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: os-service-config
          env:
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: APP_JWT_SECRET
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: SPRING_RABBITMQ_PASSWORD
            # Senhas do login de staff (admin, atendente, tecnico); a plataforma cria as chaves.
            - name: APP_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: APP_SECURITY_ADMIN_PASSWORD
            - name: APP_SECURITY_ATTENDANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: APP_SECURITY_ATTENDANT_PASSWORD
            - name: APP_SECURITY_TECHNICIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: APP_SECURITY_TECHNICIAN_PASSWORD
            # Vazio desliga o agente do New Relic.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # JVM com o agente demora a subir: até 5 minutos antes de liveness/readiness valerem.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
