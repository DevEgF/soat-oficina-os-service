# SÓ DOCUMENTAÇÃO: fora do kustomization.yaml e sem valores reais.
# O Secret de verdade é criado por soat-oficina-infra-k8s/local/secrets.sh a partir do .env.local.
#
# SPRING_DATASOURCE_PASSWORD também inicializa o PostgreSQL do serviço (k8s/postgres.yaml).
# NEW_RELIC_LICENSE_KEY vazio desliga o agente do New Relic.
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secrets
  namespace: oficina
type: Opaque
stringData:
  APP_JWT_SECRET: "CHANGE_ME_min_32_bytes_openssl_rand_hex_32"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_db_password"
  SPRING_RABBITMQ_PASSWORD: "CHANGE_ME_rabbitmq_password"
  NEW_RELIC_LICENSE_KEY: ""
